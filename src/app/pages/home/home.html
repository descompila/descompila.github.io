<section class="hero container">
  <span class="eyebrow">Podcast · Educação tech</span>
  <h1>Educação de tecnologia, simplificada para todos.</h1>
  <p class="lede">
    O Descompila volta em formato de podcast: conversas diretas sobre tecnologia, carreira e o
    impacto da IA no dia a dia — sem jargão desnecessário.
  </p>
  <div class="actions">
    <app-button variant="primary" [routerLink]="'/episodios'">Ver episódios</app-button>
    <app-button variant="secondary" [href]="canalUrl">Canal no YouTube</app-button>
  </div>
</section>

<section class="container">
  <h2>Episódio mais recente</h2>
  <app-episode-card class="episode" [episodio]="ultimoEpisodio" />
</section>
