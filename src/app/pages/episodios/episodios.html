<section class="container">
  <span class="eyebrow">Todos os episódios</span>
  <h1>Episódios</h1>
  <p>Conversas sobre tecnologia, carreira e educação — sem jargão desnecessário.</p>

  <div class="grid">
    @for (episodio of episodios; track episodio.numero) {
      <app-episode-card [episodio]="episodio" [showPlayer]="true" />
    }
  </div>
</section>
